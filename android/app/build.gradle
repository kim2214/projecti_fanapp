plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase Crashlytics: google-services가 먼저 적용되어야 매핑 업로드가 동작한다.
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

//def flutterRoot = localProperties.getProperty('flutter.sdk')
//if (flutterRoot == null) {
//    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
//}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

//apply plugin: 'com.android.application'
//apply plugin: 'kotlin-android'
//apply plugin: 'com.google.gms.google-services'
//apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// key.properties 없이 릴리스를 빌드하면 조용히 debug 서명 산출물이 나온다
// (Play 업로드 시점에야 실패가 드러남). 릴리스 태스크가 요청된 경우에만
// 명시적으로 실패시킨다 — debug 빌드·CI(analyze/test)에는 영향 없음.
gradle.taskGraph.whenReady { graph ->
    if (!keystorePropertiesFile.exists()
            && graph.allTasks.any { it.name.contains('Release') }) {
        throw new GradleException(
            "android/key.properties가 없습니다 — 릴리스 빌드에는 릴리스 서명이 필수입니다.")
    }
}

android {
    namespace "com.devkim.honeyz_fan_app"
    // Play 정책: Android 16(API 36) 타겟 요구. Flutter 3.35 기본값(35)을 override.
    compileSdkVersion 36
    // Firebase 등 플러그인들이 최소 NDK 27.0.12077973을 요구한다. NDK는 하위 호환이라
    // 설치돼 있는 상위 버전(27.2.x)으로 지정해 요구치를 충족한다.
    ndkVersion "27.2.12479018"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.devkim.honeyz_fan_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            // key.properties가 없으면 위 taskGraph 가드가 릴리스 빌드를 실패시키므로,
            // debug 서명으로 조용히 폴백하지 않는다.
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.appcompat:appcompat:1.7.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
