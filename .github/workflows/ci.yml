name: CI

# PR과 master 푸시에서 정적 분석·테스트를 자동 실행해 회귀를 막는다.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 로컬 개발 환경(Flutter 3.35.3 stable / Dart 3.9.2)과 동일하게 고정한다.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true

      # Firebase 설정 파일은 키를 포함해 gitignore되어 저장소에 없다.
      # analyze/test는 실제 Firebase 연결이 필요 없으므로 placeholder 스텁을 생성한다.
      - name: Generate Firebase options stub
        run: |
          cat > lib/default_firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/foundation.dart';

          // CI 전용 스텁 — 실제 키는 gitignore된 로컬/배포 환경 파일에 있다.
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  throw UnsupportedError('This platform is not supported');
              }
            }

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'ci-stub',
              appId: '1:0:android:0',
              messagingSenderId: '0',
              projectId: 'ci-stub',
              storageBucket: 'ci-stub.appspot.com',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: 'ci-stub',
              appId: '1:0:ios:0',
              messagingSenderId: '0',
              projectId: 'ci-stub',
              storageBucket: 'ci-stub.appspot.com',
            );
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      # 포맷 위반은 빌드 실패 대신 경고로만 남긴다 (스타일은 차단 사유가 아님).
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
